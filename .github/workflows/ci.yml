name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }}, ${{ matrix.numpy }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        numpy: ["numpy>=2"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            numpy: "numpy<2"
          - os: macos-latest
            python-version: "3.12"
            numpy: "numpy>=2"
          - os: macos-latest
            python-version: "3.14"
            numpy: "numpy>=2"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.numpy }}" ".[test]"

      - name: Run tests
        run: pytest -v

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Install built wheel
        run: python -m pip install dist/*.whl pytest

      - name: Test installed wheel
        working-directory: /tmp
        run: pytest --pyargs sharedmem -v
